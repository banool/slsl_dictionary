<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<!-- Google Play feature graphic (1024x500), the source of feature_graphic.png
     next to this file. Colours are dictionarylib's Hearth light tokens (keep
     them in step with theme.dart, as with site/src/index.html); logo_circle.png
     is assets/icon/logo.png cropped to its circle. Render it at exactly that
     viewport with any headless Chromium, from this directory:
       chromium --headless=new --hide-scrollbars --force-device-scale-factor=1 \
         --window-size=1024,500 --virtual-time-budget=10000 \
         --screenshot=feature_graphic.png feature_graphic.html
     then upload it to the en-AU listing's featureGraphic slot. -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Hanken+Grotesk:wght@500;600&family=Noto+Sans+Sinhala:wght@500&family=Noto+Sans+Tamil:wght@500&display=block" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: #FBF5EE;
    display: flex; align-items: center; justify-content: center; gap: 56px;
    font-family: 'Hanken Grotesk', sans-serif; color: #2A201A;
    position: relative;
  }
  .blob { position: absolute; border-radius: 50%; background: #F6D9C8; opacity: 0.55; }
  .b1 { width: 520px; height: 520px; left: -170px; top: -150px; }
  .b2 { width: 360px; height: 360px; right: -120px; bottom: -170px; }
  img { width: 300px; height: 300px; position: relative; }
  .text { position: relative; }
  h1 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 84px; line-height: 1; margin: 0 0 18px; letter-spacing: -1.5px; }
  .tag { font-size: 40px; font-weight: 600; color: #B06544; margin: 0 0 22px; }
  .langs { font-size: 30px; font-weight: 500; color: #6F6155; margin: 0; }
  .si { font-family: 'Noto Sans Sinhala', sans-serif; }
  .ta { font-family: 'Noto Sans Tamil', sans-serif; }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <img src="logo_circle.png" alt="" />
  <div class="text">
    <h1>SLSL Dictionary</h1>
    <p class="tag">Sri Lankan Sign Language</p>
    <p class="langs">English · <span class="si">සිංහල</span> · <span class="ta">தமிழ்</span></p>
  </div>
</body>
</html>
