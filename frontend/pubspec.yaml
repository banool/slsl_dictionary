name: slsl_dictionary
description: Free video dictionary for Sri Lankan Sign Language

publish_to: 'none'

version: 2.1.25+326

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: ">=3.47.0"

dependencies:
  cached_network_image: ^4.0.0
  carousel_slider:
  dictionarylib:
    # path: ../../dictionarylib
    git:
      url: https://github.com/banool/dictionarylib.git
      # NOTE: keep this ref and dictionarylib_test_support's ref (below, in
      # dev_dependencies) on the SAME commit when repinning.
      ref: 290e510a2b4925c593acceecad3aee803f971c4d
  dolphinsr: ^4.0.0
  dots_indicator:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_native_splash:
  go_router:
  http:
  intl:
  json_annotation: ^4.8.1
  json_serializable: ^6.7.0
  settings_ui:
  shared_preferences:
  url_launcher:
  media_kit:

dev_dependencies:
  # The shared integration-test suites. Same repo as dictionarylib — pin the
  # ref to the SAME commit as the dictionarylib dependency above.
  dictionarylib_test_support:
    git:
      url: https://github.com/banool/dictionarylib.git
      ref: 290e510a2b4925c593acceecad3aee803f971c4d
      path: dictionarylib_test_support
  build_runner: ^2.3.3
  dependency_validator: ^5.0.5
  device_info_plus:
  flutter_driver:
    sdk: flutter
  flutter_launcher_icons:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints:

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icon/logo.png"

# Held back on 2026-10-22. shared_preferences_android 2.5.0 and
# shared_preferences_foundation 2.6.0 (both published 2026-10-17) rewrote how
# the plugin talks to the platform (JNI and FFI in place of method channels).
# The Android one crashed release builds at startup until 2.5.2, published the
# day of this upgrade, and the iOS one can't be run in release mode off a
# device. Every setting and every saved list goes through this plugin, so it
# stays on the versions the app has been shipping until the rewrites have had
# some time in the wild. Drop both lines at a later dependency upgrade.
dependency_overrides:
  shared_preferences_android: 2.4.28
  shared_preferences_foundation: 2.5.7

flutter:
  uses-material-design: true
  generate: true
  # MSAL Android config for Microsoft sign-in (msal_auth). The plugin reads this
  # at app-creation time; client_id + redirect_uri are injected from
  # SharingAuthConfig, so they're absent here. See the backend MANUAL_SETUP.md §4.
  assets:
    - assets/msal_config.json
    # The splash logo, bundled so the cold-start loading screen (see
    # buildStartupLogo in lib/main.dart) can hand off from the native splash
    # with the same artwork.
    - assets/icon/logo.png

